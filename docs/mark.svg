<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LevelPace">
  <!--
    The mark players actually see in game: Shadow Word: Pain's red skull on
    black, inside the minimap tracking ring. The first draft of this file was
    a violet orb, drawn from what the tint code INTENDED. But SetVertexColor
    multiplies, the texture is red-heavy, and on a real client the button
    reads as a red skull. Everyone liked it, so the skull is canon and this
    file matches the game rather than the intention.

    (An XML comment cannot contain a double hyphen, which is why these
    sentences use full stops where the rest of this repo would not.)

    Drawn, not lifted from the client: crisp at 16px in a tab, and ours.
  -->
  <defs>
    <radialGradient id="pit" cx="50%" cy="42%" r="65%">
      <stop offset="0%"  stop-color="#3d0a0a"/>
      <stop offset="55%" stop-color="#1a0507"/>
      <stop offset="100%" stop-color="#070304"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#ff3b2f" stop-opacity=".5"/>
      <stop offset="60%" stop-color="#a3110d" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#a3110d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ff8a70"/>
      <stop offset="45%" stop-color="#e0392c"/>
      <stop offset="100%" stop-color="#7c100c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#514248"/>
      <stop offset="50%" stop-color="#171014"/>
      <stop offset="100%" stop-color="#3c2a30"/>
    </linearGradient>
  </defs>

  <!-- tracking ring -->
  <circle cx="32" cy="32" r="30" fill="url(#ring)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#050304" stroke-width="1.5"/>

  <!-- black pit with an ember of red light -->
  <circle cx="32" cy="32" r="25" fill="url(#pit)"/>
  <circle cx="32" cy="32" r="25" fill="url(#ember)"/>

  <!-- the skull -->
  <g>
    <!-- cranium and jaw as one silhouette -->
    <path d="M32 14.5
             c 8.6 0, 14 6.1, 14 13.4
             c 0 4.6 -2.3 7.6 -4.9 9.5
             l 0 5.3 c 0 1.8 -1.3 3.3 -3.1 3.3
             l -12 0 c -1.8 0 -3.1 -1.5 -3.1 -3.3
             l 0 -5.3 c -2.6 -1.9 -4.9 -4.9 -4.9 -9.5
             c 0 -7.3 5.4 -13.4 14 -13.4 z"
          fill="url(#bone)"/>
    <!-- rim light so it pops off the pit at small sizes -->
    <path d="M32 14.5 c 8.6 0, 14 6.1, 14 13.4"
          fill="none" stroke="#ffb49e" stroke-opacity=".7" stroke-width="1.4"
          stroke-linecap="round"/>

    <!-- eye sockets: black, with a red spark deep in each -->
    <ellipse cx="25.9" cy="28.6" rx="4.1" ry="4.6" fill="#0a0304"/>
    <ellipse cx="38.1" cy="28.6" rx="4.1" ry="4.6" fill="#0a0304"/>
    <circle cx="26.4" cy="29.6" r="1.2" fill="#ff4a33"/>
    <circle cx="37.6" cy="29.6" r="1.2" fill="#ff4a33"/>

    <!-- nasal cavity -->
    <path d="M32 32.4 l 2 4.4 l -4 0 z" fill="#0a0304"/>

    <!-- teeth: gaps cut into the jaw -->
    <path d="M27.4 41.2 l 0 4.2 M30.5 41.6 l 0 4.4 M33.5 41.6 l 0 4.4 M36.6 41.2 l 0 4.2"
          stroke="#0a0304" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
