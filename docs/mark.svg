<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LevelPace">
  <!--
    The same mark players click in game: a dark orb of violet shadow-magic
    inside the minimap's tracking ring. Drawn rather than lifted, so it stays
    crisp at 16px in a browser tab and at 512px on a page, and so it is ours.
  -->
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="72%">
      <stop offset="0%"  stop-color="#c79bff"/>
      <stop offset="38%" stop-color="#7d3fd6"/>
      <stop offset="72%" stop-color="#2a1348"/>
      <stop offset="100%" stop-color="#070410"/>
    </radialGradient>
    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#a06bff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3568"/>
      <stop offset="50%" stop-color="#1c1030"/>
      <stop offset="100%" stop-color="#3a2754"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#ring)"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#0a0612" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="25" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="25" fill="url(#haze)"/>

  <!-- The swirl: shadow energy curling in, which is what the in-game icon
       reads as at a glance. -->
  <path d="M32 12
           C 45 17, 49 30, 41 38
           C 35 44, 25 42, 23 35
           C 21.5 29.5, 26 25, 30.5 26.5
           C 34 27.6, 35 31.5, 32.6 33.6"
        fill="none" stroke="#e2ccff" stroke-opacity=".92"
        stroke-width="3.1" stroke-linecap="round"/>
  <path d="M32 12
           C 45 17, 49 30, 41 38
           C 35 44, 25 42, 23 35"
        fill="none" stroke="#ffffff" stroke-opacity=".38"
        stroke-width="1.1" stroke-linecap="round"/>

  <circle cx="32.6" cy="33.6" r="2.5" fill="#f3e8ff"/>
  <circle cx="32.6" cy="33.6" r="5.4" fill="#a06bff" opacity=".38"/>
</svg>
