<title>LevelPace Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:        #0a0810;
    --ink-2:      #100c1a;
    --line:       #241d38;
    --line-soft:  #191330;
    --text:       #e6e0f5;
    --text-dim:   #7d739a;
    --text-faint: #4a4265;
    --violet:     #a06bff;
    --violet-dim: #6b48b0;

    /* WarcraftLogs bands. The five item qualities plus their pink and gold. */
    --grey:   #9d9d9d;
    --green:  #1eff00;
    --blue:   #0070dd;
    --purple: #a335ee;
    --orange: #ff8000;
    --pink:   #e268a8;
    --gold:   #e5cc80;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 15% -10%, #1b1030 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #14102a 0%, transparent 55%),
      var(--ink);
    color: var(--text);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* Faint grain so the flat dark does not look like a default terminal. */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: .035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
  }

  .wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: 0 22px; }

  header {
    padding: 56px 0 26px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400; font-size: 47px; letter-spacing: .01em;
    margin: 0; line-height: 1;
  }
  h1 em { font-style: italic; color: var(--violet); }
  .tag {
    color: var(--text-dim); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase;
  }
  .live { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: var(--text-dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .dot.ok   { background: #34d17a; box-shadow: 0 0 11px #34d17a88; }
  .dot.bad  { background: #ff5f56; box-shadow: 0 0 11px #ff5f5688; }

  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--line-soft); border: 1px solid var(--line); margin: 30px 0 40px; }
  .cell { background: var(--ink-2); padding: 20px 18px; }
  .cell .n { font-family: "Instrument Serif", Georgia, serif; font-size: 38px; line-height: 1; }
  .cell .k { color: var(--text-dim); font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase; margin-top: 9px; }

  h2 {
    font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
    font-size: 27px; margin: 44px 0 4px; display: flex; align-items: baseline; gap: 14px;
  }
  h2 .note { font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--text-faint); letter-spacing: .08em; }

  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th {
    text-align: left; font-weight: 400; font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
    padding: 0 12px 9px; border-bottom: 1px solid var(--line);
  }
  th.r, td.r { text-align: right; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  tr:hover td { background: #ffffff05; }
  .rank { color: var(--text-faint); width: 34px; }
  .who { font-weight: 600; }
  .realm { color: var(--text-faint); font-size: 11px; }

  /* The bar says share-of-leader. The colour says percentile band. Those
     answer different questions and are deliberately not merged. */
  .bar { position: relative; height: 5px; background: #ffffff0d; border-radius: 3px; overflow: hidden; min-width: 90px; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; display: block; }

  .band { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; }
  .b-grey   { color: var(--grey); }
  .b-green  { color: var(--green); }
  .b-blue   { color: var(--blue); }
  .b-purple { color: var(--purple); }
  .b-orange { color: var(--orange); }
  .b-pink   { color: var(--pink); }
  .b-gold   { color: var(--gold); text-shadow: 0 0 14px #e5cc8055; }

  .empty {
    border: 1px dashed var(--line); padding: 30px 26px; margin-top: 16px;
    color: var(--text-dim); background: #ffffff03;
  }
  .empty strong { color: var(--text); font-weight: 600; }
  .empty ol { margin: 14px 0 0; padding-left: 20px; }
  .empty li { margin: 5px 0; }
  code { background: #ffffff0a; border: 1px solid var(--line); padding: 1px 6px; border-radius: 3px; font-size: 12px; color: var(--violet); }

  footer { margin-top: 60px; padding-top: 22px; border-top: 1px solid var(--line); color: var(--text-faint); font-size: 11.5px; display: flex; gap: 22px; flex-wrap: wrap; }
  a { color: var(--violet-dim); }
  a:hover { color: var(--violet); }

  .scroll { overflow-x: auto; }
  @media (max-width: 620px) { h1 { font-size: 34px; } header { padding-top: 34px; } }
</style>

<div class="wrap">
  <header>
    <h1>LevelPace <em>Ledger</em></h1>
    <span class="tag">operator view</span>
    <span class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  </header>

  <div class="totals" id="totals"></div>

  <h2>Levelling <span class="note">levels per hour</span></h2>
  <div id="board-levelling" class="scroll"></div>

  <h2>Battlegrounds <span class="note">lifetime honorable kills</span></h2>
  <div id="board-pvp" class="scroll"></div>

  <h2>Rare hunters <span class="note">rare kills counted</span></h2>
  <div id="board-rares" class="scroll"></div>

  <h2>Rare kill log <span class="note">who killed what, and when</span></h2>
  <div id="rarelog" class="scroll"></div>

  <footer>
    <span id="api"></span>
    <a href="https://github.com/monscorps/levelpace/issues" target="_blank" rel="noopener">Report a problem</a>
    <a href="https://monscorps.github.io/levelpace" target="_blank" rel="noopener">Public board</a>
    <span id="refreshed"></span>
  </footer>
</div>

<script>
const API = (location.hash && location.hash.slice(1)) ||
            "https://levelpace.andustemme.workers.dev";
document.getElementById("api").textContent = API.replace(/^https?:\/\//, "");

const BANDS = ["grey", "green", "blue", "purple", "orange", "pink", "gold"];
const bandClass = b => BANDS.includes(b) ? "b-" + b : "b-grey";
const fmt = n => (n == null ? "—" : Number(n).toLocaleString(undefined, { maximumFractionDigits: 2 }));

function setStatus(ok, text) {
  document.getElementById("dot").className = "dot " + (ok ? "ok" : "bad");
  document.getElementById("status").textContent = text;
}

async function get(path) {
  const r = await fetch(API + path, { cache: "no-store" });
  if (!r.ok) throw new Error(path + " → " + r.status);
  return r.json();
}

function emptyBoard(what) {
  return `<div class="empty">
    <strong>Nothing here yet.</strong> ${what}
    <ol>
      <li>In game, click the minimap button → <strong>Share to leaderboard</strong></li>
      <li>Type <code>/reload</code> — this writes everything already recorded</li>
      <li>Right-click the companion tray icon → <strong>Upload now</strong></li>
    </ol>
  </div>`;
}

function renderBoard(el, entries, valueLabel) {
  if (!entries || !entries.length) { el.innerHTML = emptyBoard("No one has uploaded to this board."); return; }
  const top = entries[0].metric || 0;
  el.innerHTML = `<table>
    <thead><tr>
      <th class="rank">#</th><th>Player</th><th style="width:38%">Standing</th>
      <th class="r">${valueLabel}</th><th class="r">Percentile</th><th class="r">Band</th>
    </tr></thead><tbody>
    ${entries.map((e, i) => {
      const pct = e.percentile;
      const cls = bandClass(e.band);
      const fill = top > 0 ? Math.max(2, (e.metric / top) * 100) : 0;
      const colour = getComputedStyle(document.documentElement)
        .getPropertyValue("--" + (BANDS.includes(e.band) ? e.band : "grey"));
      return `<tr>
        <td class="rank">${i + 1}</td>
        <td><span class="who">${e.name ?? "?"}</span>${e.realm ? ` <span class="realm">${e.realm}</span>` : ""}</td>
        <td><span class="bar"><i style="width:${fill}%;background:${colour}"></i></span></td>
        <td class="r">${fmt(e.metric)}</td>
        <td class="r">${pct == null ? "—" : Math.round(pct) + "%"}</td>
        <td class="r band ${cls}">${e.band ?? "—"}</td>
      </tr>`;
    }).join("")}
    </tbody></table>`;
}

function renderRares(el, kills) {
  if (!kills || !kills.length) { el.innerHTML = emptyBoard("No rare kills have been reported."); return; }
  el.innerHTML = `<table>
    <thead><tr><th>Rare</th><th>Killed by</th><th>When</th><th class="r">How</th></tr></thead>
    <tbody>${kills.map(k => `<tr>
      <td class="who">${k.name ?? "#" + k.npc}</td>
      <td>${k.by ?? "?"}</td>
      <td>${new Date(k.at * 1000).toLocaleString()}</td>
      <td class="r realm">${k.witnessed ? "witnessed" : "killing blow"}${k.learned ? " · learned" : ""}</td>
    </tr>`).join("")}</tbody></table>`;
}

async function refresh() {
  try {
    const s = await get("/api/stats");
    setStatus(true, "live");
    document.getElementById("totals").innerHTML = [
      ["Players", s.characters], ["Levels", s.levels], ["Rare kills", s.rareKills],
      ["Installs", s.installs], ["Quarantined", s.quarantined],
    ].map(([k, n]) => `<div class="cell"><div class="n">${n ?? 0}</div><div class="k">${k}</div></div>`).join("");

    const [lv, pvp, rares, log] = await Promise.all([
      get("/api/leaderboard?board=levelling").catch(() => ({ entries: [] })),
      get("/api/leaderboard?board=pvp").catch(() => ({ entries: [] })),
      get("/api/leaderboard?board=rares").catch(() => ({ entries: [] })),
      get("/api/rares?limit=40").catch(() => ({ kills: [] })),
    ]);
    renderBoard(document.getElementById("board-levelling"), lv.entries, "Levels/hr");
    renderBoard(document.getElementById("board-pvp"), pvp.entries, "Kills");
    renderBoard(document.getElementById("board-rares"), rares.entries, "Rares");
    renderRares(document.getElementById("rarelog"), log.kills);

    document.getElementById("refreshed").textContent =
      "updated " + new Date().toLocaleTimeString();
  } catch (err) {
    setStatus(false, "cannot reach the API");
    document.getElementById("totals").innerHTML =
      `<div class="cell" style="grid-column:1/-1"><div class="k">${String(err.message)}</div></div>`;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
